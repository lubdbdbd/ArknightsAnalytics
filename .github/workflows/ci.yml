name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest --cov=arknights_merch_analytics --cov-report=term-missing
      - run: python scripts/run_pipeline.py --use-fixture --as-of 2026-09-01T00:00:00+08:00

